name: Release from main

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: write
  actions: write

concurrency:
  group: release-from-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Confirm released commit is current main
        id: main
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          current_main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [ "$CANDIDATE_SHA" = "$current_main_sha" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale CI commit $CANDIDATE_SHA; main is $current_main_sha."
          fi

      - name: Set up Ruby
        if: steps.main.outputs.current == 'true'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version

      - name: Resolve release tag
        if: steps.main.outputs.current == 'true'
        id: version
        run: |
          tag="$(ruby -Ilib -rlogister/version -e 'print "v#{Logister::VERSION}"')"
          grep -Eq "^## ${tag}([[:space:]]|-|$)" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no heading for ${tag}."
            exit 1
          }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create or recover immutable release and dispatch publication
        if: steps.main.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: >-
          python3 scripts/prepare-release.py
          --tag "$RELEASE_TAG"
          --workflow release.yml
          --paths lib README.md LICENSE CHANGELOG.md logister-ruby.gemspec
