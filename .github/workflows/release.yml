name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable vX.Y.Z tag to publish or recover
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable tag belongs to reviewed main
        run: bash scripts/verify-release-ref.sh

      - name: Check public repository safety
        run: bash scripts/publication-safety-check.sh

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Verify tag matches gem version
        run: |
          ruby -Ilib -rlogister/version <<'RUBY'
          expected_tag = "v#{Logister::VERSION}"
          actual_tag = ENV.fetch("RELEASE_TAG")

          abort("Tag #{actual_tag} does not match gem version #{expected_tag}.") unless actual_tag == expected_tag
          RUBY

      - name: Prepare release notes
        run: |
          title="$(awk -v tag="$RELEASE_TAG" '
            $0 ~ "^## " tag "([[:space:]]|-|$)" { sub(/^## /, ""); print; exit }
          ' CHANGELOG.md)"
          test -n "$title"
          awk -v tag="$RELEASE_TAG" '
            $0 ~ "^## " tag "([[:space:]]|-|$)" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          echo "RELEASE_TITLE=$title" >> "$GITHUB_ENV"

      - name: Run tests
        run: bundle exec rake test

      - name: Audit dependencies
        run: |
          gem install bundler-audit --no-document
          bundle-audit check --update

      - name: Build gem
        run: bundle exec rake build

      - name: Inspect gem file list
        run: |
          gem_file="pkg/logister-ruby-${RELEASE_TAG#v}.gem"
          test -f "$gem_file"
          files="$(gem specification "$gem_file" files --yaml)"
          if echo "$files" | grep -Eq '(^|/)(\.env|tmp/release-|[^/]+\.(key|pem|p12|pfx))$|^/|\.\./'; then
            echo "::error::Gem contains a publication-unsafe path."
            exit 1
          fi

      - name: Check RubyGems package version
        id: rubygems_package
        run: |
          ruby <<'RUBY' >> "$GITHUB_OUTPUT"
          require "json"
          require "net/http"

          version = ENV.fetch("RELEASE_TAG").delete_prefix("v")
          uri = URI("https://rubygems.org/api/v1/versions/logister-ruby.json")
          response = Net::HTTP.get_response(uri)
          abort("RubyGems lookup failed with HTTP #{response.code}.") unless response.is_a?(Net::HTTPSuccess)
          versions = JSON.parse(response.body)
          exists = versions.any? { |entry| entry.fetch("number") == version }

          puts "exists=#{exists ? "true" : "false"}"
          warn exists ? "logister-ruby #{version} already exists on RubyGems." : "logister-ruby #{version} is not published on RubyGems yet."
          RUBY

      - name: Publish gem with RubyGems trusted publishing
        if: steps.rubygems_package.outputs.exists != 'true'
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1

      - name: Verify RubyGems publication
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --max-time 30 --output "$verify_dir/metadata.json" --write-out '%{http_code}' "https://rubygems.org/api/v2/rubygems/logister-ruby/versions/${version}.json")"
            case "$status" in
              200)
                ruby -rjson -rdigest -e '
                  metadata = JSON.parse(File.read(ARGV.fetch(0)))
                  abort "RubyGems package identity mismatch" unless metadata.fetch("name") == "logister-ruby" && metadata.fetch("number") == ARGV.fetch(1)
                  abort "RubyGems artifact checksum mismatch" unless metadata.fetch("sha") == Digest::SHA256.file(ARGV.fetch(2)).hexdigest
                ' "$verify_dir/metadata.json" "$version" "pkg/logister-ruby-${version}.gem"
                curl --fail --silent --show-error --location --max-time 30 "https://rubygems.org/downloads/logister-ruby-${version}.gem" --output "$verify_dir/published.gem"
                cmp "pkg/logister-ruby-${version}.gem" "$verify_dir/published.gem"
                exit 0
                ;;
              404) ;;
              *) echo "::error::RubyGems verification lookup failed with HTTP $status."; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::RubyGems did not expose the release within the verification window."
          exit 1

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --latest
          fi
