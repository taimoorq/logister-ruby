name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ["3.3", "3.4", "4.0"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check public repository safety
        run: bash scripts/publication-safety-check.sh

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Audit dependencies
        run: |
          gem install bundler-audit --no-document
          bundle-audit check --update

      - name: Run tests
        run: bundle exec rake test

      - name: Check gem builds
        run: bundle exec rake build

      - name: Check Ruby syntax
        run: ruby -e 'files = Dir["lib/**/*.rb"] + Dir["test/**/*_test.rb"] + ["test/test_helper.rb"]; files.each { |f| RubyVM::InstructionSequence.compile_file(f) }; puts "ok files=#{files.size}"'
